<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置情報で時速を表示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #speed {
            font-size: 2em;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>現在の時速</h1>
    <div id="speed">-- km/h</div>

    <script>
        let prevCoords = null;
        let prevTime = null;

        // 位置情報を取得する関数
        function updateSpeed() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    const { latitude, longitude } = position.coords;
                    const currentTime = new Date().getTime();

                    if (prevCoords && prevTime) {
                        const distance = calculateDistance(prevCoords.latitude, prevCoords.longitude, latitude, longitude);
                        const timeDiff = (currentTime - prevTime) / 1000; // 秒単位に変換
                        const speed = (distance / timeDiff) * 3.6; // m/s を km/h に変換
                        document.getElementById('speed').innerText = speed.toFixed(2) + " km/h";
                    }

                    prevCoords = { latitude, longitude };
                    prevTime = currentTime;
                }, error => {
                    console.error("位置情報が取得できません: ", error);
                });
            } else {
                alert("このブラウザでは位置情報がサポートされていません。");
            }
        }

        // 二地点間の距離を求める関数（Haversine formula）
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // 地球の半径 (m)
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // 距離 (m)
        }

        updateSpeed();
    </script>
</body>
</html>
